syntax = "proto3";

package zenquant.execution;

enum ExecStatus {
  EXEC_STATUS_FILLED = 0;
  EXEC_STATUS_REJECTED = 1;
}

message ExecutionOrder {
  string client_order_id = 1;
  string symbol = 2;
  int32 side = 3;
  double quantity = 4;
  bool reduce_only = 5;
  double max_slippage_bps = 6;
}

message ExecutionReport {
  string client_order_id = 1;
  string symbol = 2;
  ExecStatus status = 3;
  double filled_qty = 4;
  double avg_price = 5;
  double fee = 6;
  uint64 transaction_time_ns = 7;
  string reject_reason = 8;
  int32 side = 9;
}
