syntax = "proto3";

package zenquant.strategy;

enum Timeframe {
  TF_4H = 0;
  TF_1D = 1;
}

message TargetPosition {
  string portfolio = 1;
  string symbol = 2;
  Timeframe timeframe = 3;
  uint64 cutoff_time_ns = 4;
  double target_qty = 5;
  double target_leverage = 6;
  bool reduce_only = 7;
  string regime = 8;
  double regime_confidence = 9;
  repeated string reason_codes = 10;
}

message IntentReason {
  string portfolio = 1;
  string symbol = 2;
  uint64 cutoff_time_ns = 3;
  string summary = 4;
  repeated string reason_codes = 5;
}
