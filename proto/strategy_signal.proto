syntax = "proto3";

package zenquant.strategy;

enum SignalType {
  CONTINUOUS = 0;
  DISCRETE_BOOL = 1;
}

enum PA_Pattern {
  NONE = 0;
  H1_PULLBACK = 1;
  H2_RESUMPTION = 2;
  MAJOR_TREND_REVERSAL = 3;
}

message AlphaSignal {
  string factor_id = 1;
  string symbol = 2;
  SignalType type = 3;
  double continuous_value = 4;
  PA_Pattern pattern_event = 5;
  double confidence_ic = 6;
  uint64 timestamp = 7;
}

