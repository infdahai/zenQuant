name: Rust options diagnostics

on:
  push:
    branches: [main, "codex/**"]
    paths: ["options-ui/**", "playwright.options.config.js", "playwright.paper.config.js", "package.json", "package-lock.json", "docs/reports/options-payoff-mvp-*/**", "docs/reports/manual-paper-*/**", "docs/reports/vix-observation-*/**", "rust/**", ".github/workflows/rust.yml", "docs/*RUST_GUIDE.md", "docs/RUST_MODULE_BOUNDARIES.md", "docs/reports/options-*-diagnostics-*/**", "docs/reports/simulated-intents-*/**", "docs/reports/simulated-reservations-*/**"]
  pull_request:
    paths: ["options-ui/**", "playwright.options.config.js", "playwright.paper.config.js", "package.json", "package-lock.json", "docs/reports/options-payoff-mvp-*/**", "docs/reports/manual-paper-*/**", "docs/reports/vix-observation-*/**", "rust/**", ".github/workflows/rust.yml", "docs/*RUST_GUIDE.md", "docs/RUST_MODULE_BOUNDARIES.md", "docs/reports/options-*-diagnostics-*/**", "docs/reports/simulated-intents-*/**", "docs/reports/simulated-reservations-*/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Verify archived validation evidence
        run: |
          for manifest in ../docs/reports/vix-observation-*/SHA256SUMS ../docs/reports/manual-paper-*/SHA256SUMS ../docs/reports/options-payoff-mvp-*/SHA256SUMS ../docs/reports/options-*-diagnostics-*/SHA256SUMS ../docs/reports/simulated-intents-*/SHA256SUMS ../docs/reports/simulated-reservations-*/SHA256SUMS; do
            (cd "$(dirname "$manifest")" && sha256sum --check SHA256SUMS) || exit 1
          done
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test core, CLI and publication failures
        run: cargo test --workspace --all-features --locked
      - name: Build without Python
        run: cargo build --workspace --locked
      - name: Run independent quote diagnostics without external executables
        run: env PATH=/nonexistent ./target/debug/options-workbench --quote-request-file options-workbench/fixtures/quote-costs.json --output-dir "$RUNNER_TEMP/options-quote-diagnostics"
      - name: Run independent terminal diagnostics without external executables
        run: env PATH=/nonexistent ./target/debug/options-workbench --terminal-request-file options-workbench/fixtures/terminal-call-scenarios.json --output-dir "$RUNNER_TEMP/options-terminal-diagnostics"
      - name: Record, retry and replay simulated intents without external executables
        run: |
          env PATH=/nonexistent ./target/debug/simulated-intents init --store-dir "$RUNNER_TEMP/simulated-intents" --store-id ci-simulated
          env PATH=/nonexistent ./target/debug/simulated-intents record --store-dir "$RUNNER_TEMP/simulated-intents" --request-file options-workbench/fixtures/simulated-intent.json
          env PATH=/nonexistent ./target/debug/simulated-intents record --store-dir "$RUNNER_TEMP/simulated-intents" --request-file options-workbench/fixtures/simulated-intent.json
          env PATH=/nonexistent ./target/debug/simulated-intents replay --store-dir "$RUNNER_TEMP/simulated-intents"
      - name: Fund, reserve, retry and replay without external executables
        run: |
          cargo run --locked -p options-workbench --example reservation_fixture -- "$RUNNER_TEMP/reservation-inputs"
          env PATH=/nonexistent ./target/debug/simulated-reservations init
          env PATH=/nonexistent ./target/debug/simulated-reservations fund --request-file "$RUNNER_TEMP/reservation-inputs/funding.json"
          env PATH=/nonexistent ./target/debug/simulated-reservations reserve --request-file "$RUNNER_TEMP/reservation-inputs/request.json"
          env PATH=/nonexistent ./target/debug/simulated-reservations reserve --request-file "$RUNNER_TEMP/reservation-inputs/request.json"
          cd "$RUNNER_TEMP"
          env PATH=/nonexistent "$GITHUB_WORKSPACE/rust/target/debug/simulated-reservations" replay
  options-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test and Svelte build dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix options-ui
      - name: Check and build Svelte
        run: |
          npm run check --prefix options-ui
          npm test --prefix options-ui
          npm run build --prefix options-ui
      - name: Build Rust page and batch service
        working-directory: rust
        run: cargo build --release --locked -p options-workbench --bin options-ui --example paper_browser_fixture
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify running UI without Python
        run: npx playwright test --config playwright.options.config.js
      - name: Verify isolated manual paper workflow without Python
        run: npx playwright test --config playwright.paper.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: options-ui-browser-evidence
          path: |
            .artifacts/payoff-ui
            .artifacts/paper-ui
            .artifacts/vix-ui
