name: Harness Gates

on:
  push:
    branches: [main, "optimization/*", "feature/*"]
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: "Gate A: ruff lint"
        run: uv run ruff check zenquant/ tests/ scripts/

      - name: "Gate A: ruff format"
        run: uv run ruff format --check zenquant/ tests/ scripts/

      - name: Check stage2 benchmark Python reference fixture
        run: uv run python scripts/generate_perf_benchmark_golden.py --check

      - name: Check Gate v3 Python reference fixture
        run: uv run python scripts/generate_gate_v3_golden.py --check

      - name: Check episode ledger Python reference fixture
        run: uv run python scripts/generate_episode_ledger_golden.py --check

      - name: Check sizing Python reference fixture
        run: uv run python scripts/generate_sizing_golden.py --check

      - name: Check replay event Python reference fixture
        run: uv run python scripts/generate_replay_events_golden.py --check

      - name: Check offline execution Python reference fixture
        run: uv run python scripts/generate_offline_execution_golden.py --check

      - name: Check risk target Python reference fixture
        run: uv run python scripts/generate_risk_target_golden.py --check

      - name: Check trade proxy Python reference fixture
        run: uv run python scripts/generate_trade_proxy_golden.py --check

      - name: Check basis Python reference fixture
        run: uv run python scripts/generate_basis_golden.py --check

      - name: Check indicator Python reference fixture
        run: uv run python scripts/generate_indicators_golden.py --check

      - name: Check exit engine Python reference fixture
        run: uv run python scripts/generate_exit_engine_golden.py --check

      - name: Check playbook Python reference fixture
        run: uv run python scripts/generate_playbook_golden.py --check

      - name: Check state dimensions Python reference fixture
        run: uv run python scripts/generate_state_dimensions_golden.py --check

      - name: "Gate B: import boundaries"
        run: uv run pytest tests/test_import_boundaries.py -v --tb=short

      - name: "Gate C: golden output"
        run: uv run pytest tests/test_golden_output.py -v --tb=short

      - name: "Gate D: plugin/legacy parity"
        run: uv run pytest tests/test_parity.py -v --tb=short

      - name: "Gate E: full test suite"
        run: uv run pytest --tb=short -q --ignore=tests/test_import_boundaries.py --ignore=tests/test_golden_output.py --ignore=tests/test_parity.py
