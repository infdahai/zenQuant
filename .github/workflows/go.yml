name: Go mainline

on:
  push:
    branches: [main, 'refactor/**', 'feat/**', 'fix/**']
    paths: ['cmd/**', 'internal/**', 'go.mod', 'go.sum', 'testdata/**', 'docs/reports/**', 'Makefile', 'options-ui/**', 'package*.json', 'playwright.*.config.js', '.github/workflows/go.yml']
  pull_request:
    paths: ['cmd/**', 'internal/**', 'go.mod', 'go.sum', 'testdata/**', 'docs/reports/**', 'Makefile', 'options-ui/**', 'package*.json', 'playwright.*.config.js', '.github/workflows/go.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      matrix:
        # Playwright 1.58.2 in package-lock.json supports Ubuntu 24.04.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix options-ui
      - name: Verify archived validation evidence
        run: |
          for manifest in docs/reports/manual-paper-*/SHA256SUMS docs/reports/options-payoff-mvp-*/SHA256SUMS docs/reports/options-*-diagnostics-*/SHA256SUMS docs/reports/simulated-intents-*/SHA256SUMS docs/reports/simulated-reservations-*/SHA256SUMS; do
            (cd "$(dirname "$manifest")" && shasum -a 256 --check SHA256SUMS) || exit 1
          done
      - run: make check
      - run: make build
      - name: Native binary without external executables
        run: env PATH=/nonexistent ./bin/zenquant help
      - run: npx playwright install --with-deps chromium
      - run: npm run test:options
      - run: npm run test:paper
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-browser-evidence-${{ matrix.os }}
          path: |
            .artifacts/payoff-ui
            .artifacts/paper-ui
