name: Secret Benchmark (Quarterly OOS)

on:
  schedule:
    - cron: '0 0 1 1,4,7,10 *'  # Jan/Apr/Jul/Oct 1st at midnight UTC
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      - name: Download data
        run: |
          uv run python scripts/download_binance_data.py --days 2500
          uv run python scripts/download_aggtrades.py --aggregate-only || true
          uv run python scripts/download_macro_data.py || true
          uv run python scripts/download_cot.py || true

      - name: Run secret benchmark
        id: benchmark
        run: |
          uv run python scripts/secret_benchmark.py 2>&1 | tee benchmark_output.txt
        continue-on-error: true

      - name: Commit SNOOPING_LOG update
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add experiments/SNOOPING_LOG.md
          git diff --staged --quiet || git commit -m "chore: quarterly secret benchmark $(date +%Y-%m-%d)"
          git push || true

      - name: Create issue on failure
        if: steps.benchmark.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('benchmark_output.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Secret Benchmark FAILED - ${new Date().toISOString().split('T')[0]}`,
              body: `## Quarterly OOS Benchmark Failed\n\nDO NOT tune parameters based on this result.\n\n### Next steps:\n1. If market regime change → expected\n2. If infra bug → fix and re-run with --debug\n3. If strategy decay → investigate on Train/Dev sets first\n\n\`\`\`\n${output}\n\`\`\`\n\ncc: @infdahai`,
              labels: ['benchmark', 'alert', 'secret-oos']
            });

      - name: Archive output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-benchmark-${{ github.run_number }}
          path: |
            benchmark_output.txt
            experiments/SNOOPING_LOG.md
