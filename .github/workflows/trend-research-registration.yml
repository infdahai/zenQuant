name: Register trend research manifest

on:
  push:
    branches:
      - feature/trend-registration-time-space-hypothesis
      - feature/trend-registration-trend-participation-hypothesis
      - feature/trend-registration-time-space-execution
      - feature/trend-registration-trend-participation-execution
  workflow_dispatch:
    inputs:
      manifest_kind:
        description: Immutable record type to register
        required: true
        type: choice
        options:
          - hypothesis
          - execution
      manifest_path:
        description: Checked-in JSON manifest path
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  register:
    name: Register one immutable manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Select immutable registration manifest
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_MANIFEST_KIND: ${{ inputs.manifest_kind }}
          INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)
              python - <<'PY'
          import os
          from pathlib import Path

          from zenquant.research.registration import resolve_bootstrap_registration

          manifest_kind, manifest_path = resolve_bootstrap_registration(os.environ["REF_NAME"])
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as github_env:
              github_env.write(f"MANIFEST_KIND={manifest_kind}\nMANIFEST_PATH={manifest_path}\n")
          PY
              ;;
            workflow_dispatch)
              case "$INPUT_MANIFEST_PATH" in *$'\n'*|*$'\r'*) exit 1 ;; esac
              printf 'MANIFEST_KIND=%s\nMANIFEST_PATH=%s\n' "$INPUT_MANIFEST_KIND" "$INPUT_MANIFEST_PATH" >> "$GITHUB_ENV"
              ;;
            *) exit 1 ;;
          esac

      - name: Validate manifest identity
        shell: bash
        run: |
          set -euo pipefail
          case "$MANIFEST_KIND" in
            hypothesis)
              case "$MANIFEST_PATH" in config/research/*_hypothesis_v1.json) ;; *) exit 1 ;; esac
              ;;
            execution)
              case "$MANIFEST_PATH" in config/research/registrations/*_execution_v1.json) ;; *) exit 1 ;; esac
              ;;
            *) exit 1 ;;
          esac
          test -f "$MANIFEST_PATH"
          git ls-files --error-unmatch -- "$MANIFEST_PATH"
          git cat-file -e "$GITHUB_SHA:$MANIFEST_PATH"
          git diff --quiet "$GITHUB_SHA" -- "$MANIFEST_PATH"
          git show "$GITHUB_SHA:$MANIFEST_PATH" | cmp -s - "$MANIFEST_PATH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Build trusted registration receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > provider-run.json
          python scripts/build_trend_registration_receipt.py \
            --manifest-path "$MANIFEST_PATH" \
            --commit-sha "$GITHUB_SHA" \
            --provider-run-json provider-run.json \
            --output registration_receipt.json

      - name: Upload registration receipt
        uses: actions/upload-artifact@v4
        with:
          name: trend-registration-receipt-${{ github.run_id }}
          path: registration_receipt.json
          if-no-files-found: error
          retention-days: 90
