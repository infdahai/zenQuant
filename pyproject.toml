[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zenquant"
version = "0.1.0"
description = "ZenQuant 4.0 Phase 1 deterministic indicator-first kernel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.2.2",
    "fastapi>=0.115.0",
    "pyarrow>=20.0.0",
    "psycopg[binary]>=3.2.9",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
zenquant-backtest = "zenquant.app.backtest:main"
zenquant-demo = "zenquant.app.demo:main"
zenquant-history-sync = "zenquant.app.history_sync:main"
zenquant-live-validate = "zenquant.app.live_validate:main"
zenquant-web = "zenquant.app.server:main"

[tool.setuptools.packages.find]
include = ["zenquant*"]
