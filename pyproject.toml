[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zenquant"
version = "0.1.0"
description = "ZenQuant 3.0 reference implementation"
readme = "IMPLEMENTATION.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
zenquant-demo = "zenquant.app.demo:main"
zenquant-web = "zenquant.app.server:main"

[tool.setuptools.packages.find]
include = ["zenquant*"]
