[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zenquant"
version = "0.1.0"
description = "ZenQuant 4.0 Phase 1 deterministic indicator-first kernel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.2.2",
    "fastapi>=0.115.0",
    "pyarrow>=20.0.0",
    "psycopg[binary]>=3.2.9",
    "uvicorn[standard]>=0.30.0",
    "stable-baselines3>=2.8.0",
    "gymnasium>=1.2.3",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21.0"]
macro = ["yfinance>=0.2.0"]
optimize = ["optuna>=4.0.0"]

[project.scripts]
zenquant-backtest = "zenquant.app.backtest:main"
zenquant-demo = "zenquant.app.demo:main"
zenquant-history-sync = "zenquant.app.history_sync:main"
zenquant-live-validate = "zenquant.app.live_validate:main"
zenquant-web = "zenquant.app.server:main"
zenquant-check = "zenquant.app.check:main"

[tool.setuptools.packages.find]
include = ["zenquant*"]

# ── Harness Engineering: Gate A (ruff) ──────────────────────

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["zenquant", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    "E501",   # line length (handled by formatter)
    "SIM108", # ternary operator
    "B008",   # function call in default arg (needed for dataclass fields)
    "UP007",  # use X | Y for union (need __future__ annotations)
    # Pre-existing patterns — progressively fix via entropy management
    "RUF059", # unused unpacked variable
    "RUF003", # ambiguous unicode in comments (Chinese)
    "RUF001", # ambiguous unicode in string
    "RUF002", # ambiguous unicode in docstring
    "RUF005", # collection literal concatenation
    "RUF006", # asyncio dangling task
    "RUF034", # useless if-else
    "B905",   # zip without strict
    "B007",   # unused loop control variable
    "SIM102", # collapsible if
    "SIM105", # suppressible exception
    "SIM118", # in-dict-keys
    "F841",   # unused variable (pre-existing)
]

[tool.ruff.lint.isort]
known-first-party = ["zenquant"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mutmut>=3.5.0",
    "pytest>=9.0",
    "ruff>=0.15.8",
]

# ── Mutation Testing ────────────────────────────────────────
[tool.mutmut]
paths_to_mutate = "zenquant/plugins/signals/options_vol_signal.py"
tests_dir = "tests/"
runner = "python -m pytest -x -q"
