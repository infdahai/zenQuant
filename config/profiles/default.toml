# Default strategy profile — balanced regime-aware trading.
#
# This profile configures the plugin-based strategy path to approximate
# the behavior of the legacy hardcoded engines.  Switch profiles by
# pointing ARCStrategyEngine at a different TOML file.

[profile]
name = "default"
version = "1.1.0"
description = "Balanced regime-aware strategy with profitability enhancements"

# ─── Signal Plugins ─────────────────────────────────────────
# Composition: weighted sum → direction in [-1, 1]

[signals.multi_momentum_signal]
enabled = true
weight = 0.45
momentum_threshold = 0.3
use_single_fallback = true
signal_sign = 1.0

[signals.cvd_signal]
enabled = true  # Re-enabled: +0.27 Sharpe in context of reduced signal set
weight = 0.25

[signals.liquidity_signal]
enabled = true
weight = 0.20
cvd_calm_threshold = 0.03
ob_extreme_threshold = 1.2

[signals.crowding_signal]
enabled = true  # Re-enabled: +0.11 Sharpe, complementary to risk guard
weight = 0.10
extreme_threshold = 1.8

[signals.macro_regime_signal]
enabled = false  # Ablation: Sharpe +0.46 when disabled (VIX/DXY ≈ NOISE for BTC)
weight = 0.12
vix_extreme_threshold = 1.5
dxy_strong_threshold = 1.5
yield_stress_threshold = 2.0

[signals.etf_flow_state_signal]
enabled = true  # Auto-neutral when no ETF flow data is available.
weight = 0.10
positive_flow_z_threshold = 0.75
negative_flow_z_threshold = -0.75
positive_streak_threshold = 3
negative_streak_threshold = 3

[signals.cme_positioning_state_signal]
enabled = true  # Auto-neutral when no CME COT data is available.
weight = 0.08
crowded_long_threshold = 1.4
crowded_short_threshold = -1.4
oi_stretch_threshold = 1.2

[signals.options_vol_signal]
enabled = true  # Auto-neutral when no data (atm_iv_z==0 → returns 0). Activates when Deribit snapshots ≥ 30.
weight = 0.15
low_iv_threshold = -0.5
high_iv_threshold = 1.5
extreme_iv_threshold = 2.5
inverted_skew_threshold = -1.0
skew_velocity_threshold = 0.5
term_inversion_threshold = -0.5
surface_dislocation_threshold = 0.55
oi_concentration_threshold = 0.55

[signals.perp_carry_stress_signal]
enabled = true
weight = 0.08
carry_stress_threshold = 0.45
leverage_pressure_threshold = 0.45

[signals.vol_structure_signal]
enabled = true
weight = 0.08
expansion_threshold = 1.30
compression_threshold = 0.85
vol_of_vol_threshold = 0.12
persistence_threshold = 0.65

[signals.cross_asset_flow_signal]
enabled = false  # IC=0.014 NOISE — disabled per IC>0.03 rule. Re-evaluate with more data.
weight = 0.10
te_threshold = 0.1

[signals.alt_risk_context_signal]
enabled = false
weight = 0.06
spread_z_threshold = 1.25
momentum_threshold = 0.04
max_magnitude = 0.45

[signals.onchain_activity_signal]
enabled = false
weight = 0.07
active_momentum_threshold = 0.015
supply_activity_threshold = 0.01
max_magnitude = 0.35

[signals.binance_metrics_state_signal]
enabled = false
weight = 0.07
oi_value_growth_threshold = 0.75
top_account_lsr_threshold = 0.75
unwind_pressure_threshold = 0.35
max_magnitude = 0.4

[signals.crash_reversal_signal]
enabled = true
weight = 0.25
crash_threshold = -0.05
deep_crash_threshold = -0.08

[signals.funding_alpha_signal]
enabled = true
weight = 0.10
# Reverted to symmetric: asymmetric IC=0.027 < 0.03 threshold
high_funding_z = 2.0
low_funding_z = -2.0

[signals.vol_mean_reversion_signal]
enabled = false  # Ablation: Sharpe +0.10 when disabled (vol spike reversion weak)
weight = 0.20
spike_threshold = 1.5
compression_threshold = 0.5

# ─── Filter Plugins ─────────────────────────────────────────
# Composition: AND chain → all must pass

[filters.quality_filter]
enabled = true
block_on_degraded = true
block_on_unsafe = true

[filters.trend_filter]
enabled = true

[filters.bear_defense_override_filter]
enabled = false
max_directional_confidence = 0.58
min_transition_risk = 0.40

# ─── Sizer Plugins ──────────────────────────────────────────
# Composition: multiplicative chain → final leverage factor

[sizers.vol_target_sizer]
enabled = true
target_vol_4h = 0.60
target_vol_1d = 0.50
min_realized_vol_ratio = 0.25

[sizers.confidence_sizer]
enabled = true

[sizers.crowding_discount_sizer]
enabled = true
positioning_discount_max = 0.65
positioning_discount_floor = 0.35
volatility_distorted_discount = 0.75
volatility_high_discount = 0.90

[sizers.binance_metrics_risk_sizer]
enabled = false
edge_threshold = 0.2
edge_discount_scale = 0.25
crowding_threshold = 1.0
crowding_discount_scale = 0.08
discount_floor = 0.65
max_discount = 0.35

[sizers.bear_defense_churn_sizer]
enabled = false
weak_confidence_threshold = 0.58
transition_risk_threshold = 0.42
weak_transition_discount = 0.88
discount_floor = 0.55

[sizers.conviction_boost_sizer]
enabled = true
confidence_threshold = 0.75
transition_risk_max = 0.30
boost_max = 1.30

[sizers.winning_position_sizer]
enabled = false  # Pyramid already handled by ExecutionKernel; double-stacking hurts reversals
win_boost_max = 1.3
lose_discount = 0.85

# ─── Exit Plugins ───────────────────────────────────────────
# Composition: priority-ordered → first match wins

[exits.invalidation_exit]
enabled = true
priority = 1

[exits.trailing_stop_exit]
enabled = true
priority = 2
atr_mult = 2.5
min_bars_before_trail = 1

[exits.profit_lock_exit]
enabled = true
priority = 3
threshold = 0.05
lock_ratio = 0.40

[exits.time_decay_exit]
enabled = true
priority = 4

[exits.regime_change_exit]
enabled = true
priority = 5
transition_risk_threshold = 0.85

# ─── Engine Overrides ───────────────────────────────────────

[engine]
portfolio = "arc"
account_equity = 100_000
max_leverage = 3.5
execution_timeframe = "4h"

[engine.playbook]
preserve_capital_transition_risk = 0.60
bull_max_leverage = 2.50
bear_max_leverage = 2.25
range_max_leverage = 1.50
